<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài khoản - Shop Dân Buôn</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/style.css">
</head>
<body class="auth-page">
<div class="auth-box">
  <h1><i class="fas fa-user"></i> Tài khoản</h1>
  <div style="text-align:center;margin:20px 0">
    <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#166534);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;margin-bottom:12px">
      <i class="fas fa-user"></i>
    </div>
    <div style="font-size:1.25rem;font-weight:700;color:#14532d" id="profileName">...</div>
    <div style="font-size:0.9rem;color:#64748b;margin-top:4px" id="profileStatus"></div>
  </div>
  <a href="/" class="btn btn-primary btn-block"><i class="fas fa-home"></i> Về trang chủ</a>
  <button class="btn btn-outline btn-block" style="margin-top:10px" onclick="doLogout()">
    <i class="fas fa-sign-out-alt"></i> Đăng xuất
  </button>
  <div class="links" style="margin-top:20px">
    Hỗ trợ: <a href="tel:0826024568">0826024568</a> ·
    <a href="https://zalo.me/0826024568" target="_blank" rel="noopener">Zalo</a>
  </div>
</div>
<script>
function doLogout() {
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  location.href = '/';
}

(function() {
  var name = localStorage.getItem('username');
  var token = localStorage.getItem('token');
  var el = document.getElementById('profileName');
  var st = document.getElementById('profileStatus');
  if (name && token) {
    el.textContent = name;
    st.textContent = 'Đã đăng nhập';
  } else {
    el.textContent = 'Chưa đăng nhập';
    st.textContent = 'Vui lòng đăng nhập để xem tài khoản';
    setTimeout(function() { location.href = '/auth'; }, 1200);
  }
})();
</script>
</body>
</html>
